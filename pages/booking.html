<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt tour</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header id="header"></header>
<main class="container">
  <form id="bookingForm" class="form">
    <h1>Đặt tour</h1>
    <div class="form-group"><label>Họ tên</label><input id="name" required></div>
    <div class="form-group"><label>Số điện thoại</label><input id="phone" required></div>
    <div class="form-group"><label>Chọn tour</label><select id="tour" required></select></div>
    <div class="form-group"><label>Số người</label><input id="quantity" type="number" min="1" value="1" required></div>
    <button class="btn" type="submit">Xác nhận đặt tour</button>
  </form>
</main>
<footer id="footer"></footer>
<script src="../js/data.js"></script>
<script src="../js/common.js"></script>
<script src="../js/booking.js"></script>
</body>
</html>
