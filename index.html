<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1677ff" />
    <meta
      name="description"
      content="TravelGo - Đặt tour du lịch Việt Nam nhanh chóng. Lịch trình rõ ràng, giá hợp lý, hỗ trợ 24/7."
    />
    <title>TravelGo - Đặt tour du lịch</title>
    <script>
      /* gắn theme trước khi vẽ để không nháy trắng khi mở trang ở chế độ tối */
      (function () {
        try {
          var saved = localStorage.getItem("travelgo.theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
