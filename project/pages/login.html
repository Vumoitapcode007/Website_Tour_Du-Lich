<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản lý</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header id="header"></header>
<main class="container">
  <form id="loginForm" class="form">
    <h1>Đăng nhập quản lý</h1>
    <div class="form-group"><label>Tài khoản</label><input id="username" required></div>
    <div class="form-group"><label>Mật khẩu</label><input id="password" type="password" required></div>
    <button class="btn">Đăng nhập</button>
    <p style="margin-top:10px;color:#777">Demo: admin / 123456</p>
  </form>
</main>
<footer id="footer"></footer>
<script src="../js/common.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
